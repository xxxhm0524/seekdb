name: minivectordb-ci

on:
  push:
    branches: [2026-competition-round2]
  workflow_dispatch:

jobs:
  storage-io-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build current and previous locked images
        run: |
          docker build --network=none -t minivectordb:storage-candidate .
          mvd_storage_reference_dir=$(mktemp -d)
          git fetch --depth=1 origin 641d2de54c7837459c43e279b74f7b3ec200434e
          git archive 641d2de54c7837459c43e279b74f7b3ec200434e \
            Makefile src/main.cpp src/sql.cpp src/sql.h src/engine.cpp \
            src/engine.h src/common.h src/ann.h src/tx_spool.h | tar -x -C "$mvd_storage_reference_dir"
          tar -cf - Dockerfile docker/licenses/GCC-RUNTIME-EXCEPTION-3.1.txt | tar -xf - -C "$mvd_storage_reference_dir"
          docker build --network=none -t minivectordb:storage-reference "$mvd_storage_reference_dir"
      - name: Check the zero-block regression is red on the previous version
        run: |
          mkdir -p protocol-results
          set +e
          python3 tests/sparse_storage.py --image minivectordb:storage-reference --expect-sparse \
            --output protocol-results/sparse-storage-reference.json \
            > protocol-results/sparse-storage-reference.log 2>&1
          mvd_reference_exit=$?
          set -e
          test "$mvd_reference_exit" -eq 1
          grep -q 'allocated_bytes' protocol-results/sparse-storage-reference.log
      - name: Paired large storage requests at unchanged deadlines
        run: |
          python3 tests/docker_storage_compare.py \
            --reference-image minivectordb:storage-reference --candidate-image minivectordb:storage-candidate \
            --output protocol-results/storage-pair
      - name: Upload paired storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-io-comparison
          path: protocol-results
          if-no-files-found: ignore

  protocol-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4


      - name: Build
        run: make -j"$(nproc)"

      - name: Handshake (local process)
        run: |
          python3 protocol_check/run.py \
            --command "[\"$PWD/minivectordb\",\"--data-dir\",\"{data_dir}\"]" \
            --handshake-only --output protocol-results/handshake-local

      - name: Public cases (local process)
        run: |
          python3 protocol_check/run.py \
            --command "[\"$PWD/minivectordb\",\"--data-dir\",\"{data_dir}\"]" \
            --output protocol-results/public-local

      - name: Extended semantics
        run: python3 tests/run_extended_tsv.py

      - name: Formal requirement coverage
        run: python3 tests/formal_coverage.py

      - name: Hidden boundary regressions
        run: python3 tests/hidden_boundaries.py

      - name: Wide-exponent distance permutations
        run: |
          python3 tests/vector_precision_model.py
          python3 tests/vector_precision_model.py --indexed

      - name: Agent material format privacy and evidence references
        run: |
          python3 tests/test_agent_material.py
          python3 tests/validate_agent_material.py --path agent/conversation.json \
            --mirror conversation.json --require-evidence

      - name: Float32 conversion differential model
        run: python3 tests/float_parse_model.py

      - name: TopK rejection boundary numeric model
        run: python3 tests/heap_rejection_model.py

      - name: Filtered candidate cache model
        run: python3 tests/filter_cache_model.py

      - name: Bounded scan and mutation memory
        run: python3 tests/resource_boundaries.py

      - name: Bounded wide-row mutation I/O
        run: python3 tests/mutation_io.py

      - name: Sparse storage alignment overwrite and filesystem fallback
        run: |
          python3 tests/sparse_io_model.py
          python3 tests/sparse_storage.py --expect-sparse --output protocol-results/sparse-storage-local.json

      - name: WAL sequential read cache and offset reuse
        run: python3 tests/wal_read_model.py

      - name: Lossless page-image codec and bounded commit reads
        run: |
          python3 tests/page_image_codec_model.py
          python3 tests/compact_image_io.py

      - name: Primary-key projection without wide-row reads
        run: python3 tests/primary_key_projection.py

      - name: Bounded wide projection with a large OFFSET
        run: python3 tests/projection_memory.py

      - name: Bounded random spool reads
        run: python3 tests/spool_read_boundaries.py

      - name: Repeated wide scan allocation
        run: python3 tests/page_pool_churn.py

      - name: Transaction payload spill and statement rollback
        run: python3 tests/transaction_spill.py

      - name: Dirty page and prefetch coherence
        run: python3 tests/cache_coherence.py

      - name: Randomized model stress
        run: python3 tests/stress_random.py --rounds 20 --seed 7

      - name: Regression and crash recovery
        run: python3 tests/regression.py

      - name: Repeated kills during recovery
        run: python3 tests/crash_recovery_test.py 50000

      - name: Kill during multi-table commit
        run: python3 tests/commit_crash_boundaries.py

      - name: Install benchmark dependency
        run: python3 -m pip install --break-system-packages numpy

      - name: Benchmark and recall
        run: |
          python3 tests/bench.py --rows 10000 --queries 1000 --seed 20261110 \
            --output protocol-results/benchmark-exact.json
          python3 tests/bench.py --rows 10000 --queries 1000 --seed 20261111 --search-mode ann \
            --output protocol-results/benchmark-ann.json

      - name: ANN mutations and crash rebuild
        run: |
          python3 tests/ann_lifecycle.py
          python3 tests/ann_numeric_range.py
          python3 tests/ann_index_deadline.py --output protocol-results/ann-index-deadline-local.json

      - name: Undefined-behavior sanitizer
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -fopenmp \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            src/main.cpp src/sql.cpp src/engine.cpp -o minivectordb-ubsan
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/hidden_boundaries.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/regression.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/stress_random.py --rounds 40 --seed 211
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/cache_coherence.py --rounds 4
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/vector_precision_model.py --seeds 7
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/vector_precision_model.py --seeds 7 --indexed
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/transaction_spill.py --rows 2000
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/ann_lifecycle.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/ann_numeric_range.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/mutation_io.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/spool_read_boundaries.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/filter_cache_model.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/primary_key_projection.py
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/projection_memory.py --rows 400 --max-mb 512
          python3 tests/heap_rejection_model.py --sanitize undefined
          python3 tests/sparse_io_model.py --sanitize undefined
          python3 tests/wal_read_model.py --sanitize undefined
          python3 tests/page_image_codec_model.py --sanitize undefined
          MVD_BIN="$PWD/minivectordb-ubsan" python3 tests/compact_image_io.py --rows 1000

      - name: Docker build
        id: docker_build
        run: docker build --network=none -t minivectordb:ci .

      - name: Export locked package versions
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --entrypoint /bin/cat minivectordb:ci /runtime-packages.txt \
            > protocol-results/locked-runtime-packages.txt
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --entrypoint /bin/cat minivectordb:ci /app/build-packages.txt \
            > protocol-results/locked-build-packages.txt
          docker image inspect --format '{{.Id}}' minivectordb:ci \
            > protocol-results/locked-image-id.txt
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --entrypoint /bin/cat minivectordb:ci /app/compiler-version.txt \
            > protocol-results/locked-compiler-version.txt
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --entrypoint /bin/cat minivectordb:ci /runtime-library-sha256.txt \
            > protocol-results/locked-runtime-library-sha256.txt
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --entrypoint /bin/cat minivectordb:ci /runtime-linkage.txt \
            > protocol-results/locked-runtime-linkage.txt

      - name: Float32 model in the final locked runtime
        run: |
          docker build --network=none --target build -t minivectordb:compiler-ci .
          mkdir -p protocol-results/runtime-model
          chmod 777 protocol-results/runtime-model
          docker run --rm --network=none --cpus=2 --memory=2g \
            --mount "type=bind,src=$PWD/tests/float_parse_model.cpp,dst=/src/float-model.cpp,readonly" \
            --mount "type=bind,src=$PWD/protocol-results/runtime-model,dst=/model-out" \
            minivectordb:compiler-ci \
            g++ -std=c++20 -O2 -Isrc float-model.cpp -o /model-out/float-model
          docker run --rm --network=none --read-only --cap-drop=ALL --cpus=2 --memory=2g \
            --mount "type=bind,src=$PWD/protocol-results/runtime-model,dst=/model,readonly" \
            --entrypoint /model/float-model minivectordb:ci

      - name: Address and lifetime sanitizer
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -fopenmp \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer \
            src/main.cpp src/sql.cpp src/engine.cpp -o minivectordb-asan
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/hidden_boundaries.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/ann_lifecycle.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/ann_numeric_range.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/commit_crash_boundaries.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/mutation_io.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/spool_read_boundaries.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/filter_cache_model.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/primary_key_projection.py
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/projection_memory.py --rows 400 --max-mb 512
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/vector_precision_model.py --seeds 7 --indexed
          python3 tests/heap_rejection_model.py --sanitize address
          python3 tests/sparse_io_model.py --sanitize address
          python3 tests/wal_read_model.py --sanitize address
          python3 tests/page_image_codec_model.py --sanitize address
          MVD_BIN="$PWD/minivectordb-asan" python3 tests/compact_image_io.py --rows 1000

      - name: Docker handshake
        run: |
          python3 protocol_check/run.py --image minivectordb:ci \
            --handshake-only --output protocol-results/handshake-docker

      - name: Docker public cases
        run: |
          python3 protocol_check/run.py --image minivectordb:ci \
            --output protocol-results/public-docker

      - name: Docker sparse wide-row overwrite and recovery
        run: |
          python3 tests/sparse_storage.py --image minivectordb:ci --expect-sparse \
            --output protocol-results/sparse-storage-docker.json

      - name: Docker graph index numeric deadline
        run: |
          python3 tests/ann_index_deadline.py --image minivectordb:ci \
            --output protocol-results/ann-index-deadline-docker.json

      - name: Docker dataset larger than formal memory budget
        run: python3 tests/docker_resource_boundaries.py --image minivectordb:ci

      - name: Docker transaction larger than formal memory budget
        if: always() && steps.docker_build.outcome == 'success'
        run: python3 tests/docker_transaction_spill.py --image minivectordb:ci

      - name: Docker effective UTF-8 payload larger than 2 GiB
        if: always() && steps.docker_build.outcome == 'success'
        run: python3 tests/docker_transaction_spill.py --image minivectordb:ci --long-unicode

      - name: Docker durable benchmark and recall
        if: always() && steps.docker_build.outcome == 'success'
        run: |
          python3 tests/docker_bench.py --image minivectordb:ci --seed 20261110 \
            --output protocol-results/benchmark-docker-exact.json
          python3 tests/docker_bench.py --image minivectordb:ci --seed 20261111 --search-mode ann \
            --output protocol-results/benchmark-docker-ann.json

      - name: Docker HNSW recall on a larger collection
        if: always() && steps.docker_build.outcome == 'success'
        run: |
          python3 tests/docker_bench.py --image minivectordb:ci --rows 50000 --queries 300 \
            --seed 20261112 --search-mode ann --output protocol-results/benchmark-docker-hnsw-50k.json
          python3 tests/docker_bench.py --image minivectordb:ci --rows 50000 --queries 300 \
            --seed 20261112 --search-mode exact --output protocol-results/benchmark-docker-exact-50k.json

      - name: Docker high-dimensional ANN recall
        if: always() && steps.docker_build.outcome == 'success'
        run: |
          python3 tests/docker_bench.py --image minivectordb:ci --rows 40000 --dim 256 --queries 300 \
            --seed 20261115 --search-mode ann --output protocol-results/benchmark-docker-ann-256d.json

      - name: Build source reference for paired resource comparison
        id: reference_build
        if: always() && steps.docker_build.outcome == 'success'
        run: |
          mvd_reference_dir=$(mktemp -d)
          git fetch --depth=1 origin 082acdb96d847844962f85cd3e3f57e4d38db1dc
          git archive 082acdb96d847844962f85cd3e3f57e4d38db1dc \
            Makefile src/main.cpp src/sql.cpp src/sql.h src/engine.cpp \
            src/engine.h src/common.h src/ann.h src/tx_spool.h | tar -x -C "$mvd_reference_dir"
          tar -cf - Dockerfile docker/licenses/GCC-RUNTIME-EXCEPTION-3.1.txt | tar -xf - -C "$mvd_reference_dir"
          docker build --network=none -t minivectordb:reference-082acdb9 "$mvd_reference_dir"
          mvd_previous_dir=$(mktemp -d)
          git fetch --depth=1 origin e20904ebbf5f6044f0b1cd2093362911e82063ab
          git archive e20904ebbf5f6044f0b1cd2093362911e82063ab \
            Makefile src/main.cpp src/sql.cpp src/sql.h src/engine.cpp \
            src/engine.h src/common.h src/ann.h src/tx_spool.h | tar -x -C "$mvd_previous_dir"
          tar -cf - Dockerfile docker/licenses/GCC-RUNTIME-EXCEPTION-3.1.txt | tar -xf - -C "$mvd_previous_dir"
          docker build --network=none -t minivectordb:reference-e20904eb "$mvd_previous_dir"
          mvd_graph_dir=$(mktemp -d)
          git fetch --depth=1 origin 1996a1b422aa989a4b5c9d32c067225ca2d225f2
          git archive 1996a1b422aa989a4b5c9d32c067225ca2d225f2 \
            Makefile src/main.cpp src/sql.cpp src/sql.h src/engine.cpp \
            src/engine.h src/common.h src/ann.h src/tx_spool.h | tar -x -C "$mvd_graph_dir"
          tar -cf - Dockerfile docker/licenses/GCC-RUNTIME-EXCEPTION-3.1.txt | tar -xf - -C "$mvd_graph_dir"
          docker build --network=none -t minivectordb:reference-1996a1b4 "$mvd_graph_dir"

      - name: WAL records and bidirectional recovery
        if: always() && steps.reference_build.outcome == 'success'
        run: |
          python3 tests/wal_compatibility.py \
            --reference-image minivectordb:reference-e20904eb --candidate-image minivectordb:ci \
            --output protocol-results/wal-compatibility-docker.json

      - name: Paired time I/O and memory comparison
        if: always() && steps.reference_build.outcome == 'success'
        run: |
          python3 tests/docker_score_compare.py \
            --reference-image minivectordb:reference-082acdb9 --candidate-image minivectordb:ci \
            --reference-sha 082acdb96d847844962f85cd3e3f57e4d38db1dc --drop-caches \
            --output protocol-results/paired-score-comparison.json

      - name: Paired resource comparison with 1996a1b4
        if: always() && steps.reference_build.outcome == 'success'
        run: |
          python3 tests/docker_score_compare.py \
            --reference-image minivectordb:reference-1996a1b4 --candidate-image minivectordb:ci \
            --reference-sha 1996a1b422aa989a4b5c9d32c067225ca2d225f2 --drop-caches \
            --output protocol-results/paired-score-comparison-1996.json

      - name: Paired prepared queries on a larger collection
        if: always() && steps.reference_build.outcome == 'success'
        run: |
          python3 tests/paired_query_compare.py \
            --reference-image minivectordb:reference-1996a1b4 --candidate-image minivectordb:ci \
            --check-default-mode --output protocol-results/paired-queries-docker-50k.json

      - name: Upload protocol reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-results
          path: protocol-results
          if-no-files-found: ignore
