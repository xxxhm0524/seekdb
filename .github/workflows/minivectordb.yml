name: minivectordb-official-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-driver-and-signed-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build locked source images and run untouched official checker
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6da81bf4b562c6bb055839e30b09e3f90c615bf2 387cda5a264d338ac446536f7433e4557c0c472d
          git fetch --depth=1 https://github.com/oceanbase/seekdb.git f4d4e26653af823a7601668802f80e374ad6643c
          mvd_reference_dir=$(mktemp -d)
          mvd_candidate_dir=$(mktemp -d)
          mvd_official_dir=$(mktemp -d)
          git archive 6da81bf4b562c6bb055839e30b09e3f90c615bf2 Makefile src Dockerfile .dockerignore docker/licenses/GCC-RUNTIME-EXCEPTION-3.1.txt | tar -x -C "$mvd_reference_dir"
          git archive 387cda5a264d338ac446536f7433e4557c0c472d Makefile src Dockerfile .dockerignore docker/licenses/GCC-RUNTIME-EXCEPTION-3.1.txt | tar -x -C "$mvd_candidate_dir"
          git archive f4d4e26653af823a7601668802f80e374ad6643c STDIO_PROTOCOL.md protocol_check mysqltest | tar -x -C "$mvd_official_dir"
          docker build --network=none -t minivectordb:reference-6da81bf4 "$mvd_reference_dir"
          docker build --network=none -t minivectordb:candidate-387cda5a "$mvd_candidate_dir"
          python3 tests/official_driver_docker_pair.py --official-root "$mvd_official_dir" --reference-image minivectordb:reference-6da81bf4 --candidate-image minivectordb:candidate-387cda5a --output protocol-results/official-validation
      - name: Upload official validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-validation
          path: protocol-results/official-validation
          if-no-files-found: error
