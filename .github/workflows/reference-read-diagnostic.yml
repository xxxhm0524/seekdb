name: Reference read interception diagnostic
"on":
  push:
    branches: ['diag/reference-native-20261115']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compare the unchanged reference and candidate read-failure tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native/read_diagnostic.py
      - name: Preserve actual diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-read-diagnostic
          path: /tmp/mvd-read-diag-*/evidence/
          retention-days: 14
