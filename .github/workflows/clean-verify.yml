name: Clean MiniVectorDB verification
on:
  push:
    branches: ['rewrite/minivectordb-clean-20261114', '2026-competition-round2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build locked Linux image
        run: docker build --pull -t mvd-clean .
      - name: Official protocol and all public assertions
        run: python3 protocol_check/run.py --image mvd-clean --output results/linux-official
      - name: Portable transport against actual container
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/client.py --output results/linux-portable
      - name: Independent invariants and real SIGKILL
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/invariants.py --output results/linux-invariants
      - name: Database exceeds cgroup memory budget
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/capacity.py --output results/linux-capacity
      - name: Install locked test oracle dependency
        run: |
          /usr/bin/python3 -m venv build/oracle-venv
          build/oracle-venv/bin/python -m pip install numpy==2.2.6
      - name: Float32 oracle and task-shaped benchmark
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: build/oracle-venv/bin/python tests/benchmark.py --output results/linux-benchmark
      - name: Hostile float32 patterns with and without index cache
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: build/oracle-venv/bin/python tests/vector_edges.py --output results/linux-vector-edges
      - name: Interrupt production ELF commits and startup
        run: |
          mkdir -p build
          docker run --rm --entrypoint cat mvd-clean /app/minivectordb > build/minivectordb
          chmod +x build/minivectordb
          MVD_BIN="$PWD/build/minivectordb" python3 tests/crash_commit.py --output results/linux-crash-commit
      - name: Preserve reports and stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-verification-${{ github.sha }}
          path: |
            results/**/report.json
            results/**/result.json
            results/**/cases.json
            results/**/*.log
          if-no-files-found: warn
