name: Clean MiniVectorDB verification
on:
  push:
    branches: ['rewrite/minivectordb-clean-20261114', 'audit/minivectordb-space-20261114', 'review/scored-reference-20261114', 'review/faster-than-scored-20261114', 'audit/reference-boundaries-20261114', 'audit/full-requirements-20261114', '2026-competition-round2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build locked Linux image
        run: docker build --pull --platform linux/amd64 -t mvd-clean .
      - name: Submission contract
        run: |
          mkdir -p results/linux-submission-contract
          python3 tests/contract.py | tee results/linux-submission-contract/report.json
      - name: Preserve image and source provenance
        run: |
          mkdir -p results/provenance
          git rev-parse HEAD > results/provenance/commit.txt
          docker image inspect --format '{{.Id}}' mvd-clean > results/provenance/image.txt
          docker run --rm --entrypoint cat mvd-clean /app/build-info/compiler-version.txt > results/provenance/compiler.txt
          docker run --rm --entrypoint cat mvd-clean /app/build-info/binary.sha256 > results/provenance/binary-sha256.txt
      - name: Official protocol and all public assertions
        run: python3 protocol_check/run.py --image mvd-clean --output results/linux-official
      - name: Portable transport against actual container
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/client.py --output results/linux-portable
      - name: Complete JSON input and escaped NUL data
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/protocol_complete_input.py --output results/linux-complete-input
      - name: Arbitrary-precision and composite request identifiers
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/protocol_ids.py --output results/linux-protocol-ids
      - name: Clause-driven protocol contract matrix
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/protocol_contract.py --output results/linux-protocol-contract
      - name: Opaque nested JSON values without an artificial depth limit
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/protocol_nested_ids.py --output results/linux-nested-ids
      - name: SQL operators retain lexical token types
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/sql_token_kinds.py --output results/linux-token-kinds
      - name: Published SQL type index and transaction requirements
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/published_requirements.py --output results/linux-published-requirements
      - name: Successful-reference SQL decimal spellings
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/sql_numeric_forms.py --output results/linux-sql-numeric-forms
      - name: Explicit aliases and repeated ordinary projections
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/order_alias_boundaries.py --output results/linux-order-aliases
      - name: Independent invariants and real SIGKILL
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/invariants.py --output results/linux-invariants
      - name: Bounded storage under repeated updates
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/space_reuse.py --output results/linux-space-reuse
      - name: All fixed and variable column layouts
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/column_layouts.py --output results/linux-column-layouts
      - name: Working-column cache transitions
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/cache_column_sets.py --output results/linux-cache-column-sets
      - name: Clustered scalar ranges and Unicode filters
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/cache_ranges.py --output results/linux-cache-ranges
      - name: Bounded insert batches and late statement failures
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/insert_batches.py --output results/linux-insert-batches
      - name: Quoted spans escapes Unicode and malformed literals
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/sql_literals.py --output results/linux-sql-literals
      - name: Database exceeds cgroup memory budget
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/capacity.py --output results/linux-capacity
      - name: Install locked test oracle dependency
        run: |
          /usr/bin/python3 -m venv build/oracle-venv
          build/oracle-venv/bin/python -m pip install numpy==2.2.6
      - name: Float32 oracle and task-shaped benchmark
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: build/oracle-venv/bin/python tests/benchmark.py --output results/linux-benchmark
      - name: Hostile float32 patterns with and without index cache
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: build/oracle-venv/bin/python tests/vector_edges.py --output results/linux-vector-edges
      - name: Interrupt production ELF commits and startup
        run: |
          mkdir -p build
          docker run --rm --entrypoint cat mvd-clean /app/minivectordb > build/minivectordb
          chmod +x build/minivectordb
          MVD_BIN="$PWD/build/minivectordb" python3 tests/crash_commit.py --output results/linux-crash-commit
      - name: Exact root publication and durability-barrier cuts
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/commit_publish.py --output results/linux-commit-publish
      - name: Production-toolchain integer certificates and exact fallback
        run: |
          mkdir -p results/linux-certified-screen
          docker run --rm --network=none -v "$PWD:/src:ro" -v "$PWD/build:/out" -w /src \
            gcc:13.5.0-bookworm@sha256:8c0fe724784c6d617cb582f79ddaf5dd2233aaba2fb7a14e0b9d03348fea8088 \
            g++ -Isrc -Ithird_party -std=c++20 -O3 -DNDEBUG -ffp-contract=off -static-libstdc++ -static-libgcc \
            tests/certified_screen_probe.cpp src/vector_index.cpp src/storage.cpp src/record_reader.cpp src/model.cpp src/btree.cpp src/compaction.cpp src/vector_literal.cpp -o /out/certified-screen-probe
          build/certified-screen-probe results/linux-certified-screen-data | tee results/linux-certified-screen/report.json
      - name: Production-toolchain strict JSON decoder parity
        run: |
          mkdir -p results/linux-json-request
          docker run --rm --network=none -v "$PWD:/src:ro" -v "$PWD/build:/out" -w /src \
            gcc:13.5.0-bookworm@sha256:8c0fe724784c6d617cb582f79ddaf5dd2233aaba2fb7a14e0b9d03348fea8088 \
            g++ -Isrc -Ithird_party -std=c++20 -O3 -DNDEBUG -ffp-contract=off -static-libstdc++ -static-libgcc \
            tests/json_request_probe.cpp src/request.cpp src/model.cpp src/vector_literal.cpp -o /out/json-request-probe
          build/json-request-probe | tee results/linux-json-request/report.json
      - name: Refuse unknown files and recover incomplete first initialization
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/open_safety.py --output results/linux-open-safety
      - name: Interrupt compaction exactly at replacement boundaries
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/compaction_crash.py --output results/linux-compaction-crash
      - name: Consecutive interruptions inside recovery truncation
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/recovery_boundaries.py --output results/linux-recovery-boundaries
      - name: Recovery allocation failure must preserve latest acknowledged root
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/recovery_allocation.py --output results/linux-recovery-allocation
      - name: Measure projected query file reads
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/projection_io.py --output results/linux-projection-io
      - name: Atomic error response on final flush failure
        if: ${{ !cancelled() }}
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/response_failure.py --output results/linux-response-failure
      - name: Actual 2 GiB memory budget with larger persistent data
        env:
          MVD_DOCKER_IMAGE: mvd-clean
        run: python3 tests/capacity.py --output results/linux-capacity-2g --rows 40000 --payload 65536 --memory-mib 2048
      - name: Compare a publicly documented successful implementation
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/reference_differential.py --output results/linux-reference-differential
      - name: Qualified reference boundary comparison
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/reference_boundaries.py --reference-bin results/linux-reference-differential/reference-minivectordb --output results/linux-reference-boundaries
      - name: Qualified reference protocol response byte budget
        run: MVD_BIN="$PWD/build/minivectordb" python3 tests/reference_response_budget.py --reference-bin results/linux-reference-differential/reference-minivectordb --output results/linux-vector-response-budget
      - name: Preserve reports and stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-verification-${{ github.sha }}
          path: |
            results/**/report.json
            results/**/result.json
            results/**/cases.json
            results/**/*.log
            results/provenance/*.txt
            results/**/requests.jsonl
          if-no-files-found: warn
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build with ASan UBSan and library assertions
        run: |
          mkdir -p build
          g++ -Isrc -Ithird_party -std=c++20 -O1 -g -ffp-contract=off -D_GLIBCXX_ASSERTIONS \
            -fsanitize=address,undefined -fno-omit-frame-pointer src/*.cpp -o build/minivectordb-asan
      - name: Sanitized protocol state machine and large tree
        env:
          MVD_BIN: ${{ github.workspace }}/build/minivectordb-asan
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 tests/client.py --output results/asan-public
          python3 tests/invariants.py --output results/asan-invariants
          python3 tests/space_reuse.py --output results/asan-space
          python3 tests/column_layouts.py --output results/asan-column-layouts
          python3 tests/open_safety.py --output results/asan-open-safety
          python3 tests/protocol_complete_input.py --output results/asan-complete-input
          python3 tests/protocol_ids.py --output results/asan-protocol-ids
          python3 tests/protocol_contract.py --output results/asan-protocol-contract
          python3 tests/protocol_nested_ids.py --output results/asan-nested-ids
          python3 tests/sql_token_kinds.py --output results/asan-token-kinds
          python3 tests/published_requirements.py --output results/asan-published-requirements
          python3 tests/sql_numeric_forms.py --output results/asan-sql-numeric-forms
          python3 tests/order_alias_boundaries.py --output results/asan-order-aliases
          python3 tests/cache_column_sets.py --output results/asan-cache-column-sets
          python3 tests/cache_ranges.py --output results/asan-cache-ranges
          python3 tests/insert_batches.py --output results/asan-insert-batches
          python3 tests/sql_literals.py --output results/asan-sql-literals
      - name: Sanitized integer certificates and exact fallback
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p results/asan-certified-screen
          g++ -Isrc -Ithird_party -std=c++20 -O1 -g -ffp-contract=off -D_GLIBCXX_ASSERTIONS \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/certified_screen_probe.cpp src/vector_index.cpp src/storage.cpp src/record_reader.cpp src/model.cpp src/btree.cpp src/compaction.cpp src/vector_literal.cpp -o build/certified-screen-probe-asan
          build/certified-screen-probe-asan results/asan-certified-screen-data | tee results/asan-certified-screen/report.json
      - name: Sanitized strict JSON decoder parity
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p results/asan-json-request
          g++ -Isrc -Ithird_party -std=c++20 -O1 -g -ffp-contract=off -D_GLIBCXX_ASSERTIONS \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/json_request_probe.cpp src/request.cpp src/model.cpp src/vector_literal.cpp -o build/json-request-probe-asan
          build/json-request-probe-asan | tee results/asan-json-request/report.json
      - name: Preserve sanitizer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanitizer-verification-${{ github.sha }}
          path: |
            results/**/report.json
            results/**/*.log
          if-no-files-found: warn
