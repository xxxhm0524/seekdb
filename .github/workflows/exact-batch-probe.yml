name: Exact batch distance feasibility
on:
  push:
    branches: ['review/scored-reference-20261114']
    paths: ['src/exact_batch.hpp','tests/exact_batch_probe.cpp','.github/workflows/exact-batch-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify each available exact kernel and measure layout impact
        run: |
          mkdir -p results/exact-batch
          docker run --rm --network=none -v "$PWD:/src:ro" -v "$PWD/results/exact-batch:/out" -w /src \
            gcc:13.5.0-bookworm@sha256:8c0fe724784c6d617cb582f79ddaf5dd2233aaba2fb7a14e0b9d03348fea8088 \
            g++ -std=c++20 -O3 -DNDEBUG -ffp-contract=off -static-libstdc++ -static-libgcc tests/exact_batch_probe.cpp -o /out/probe
          results/exact-batch/probe | tee results/exact-batch/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-batch-${{ github.sha }}
          path: results/exact-batch/report.json
