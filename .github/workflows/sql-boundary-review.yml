name: sql-boundary-review
on:
  push:
    branches: [fix/reject-unclosed-comments-20261113, fix/deep-sql-audit-20261113, fix/exact-distance-rounding-20261113, fix/ddl-failure-atomicity-20261113, fix/cache-allocation-safety-20261113, fix/commit-publication-recovery-20261113]
  workflow_dispatch:
jobs:
  native-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and check SQL semantics
        run: |
          make -j2
          python3 tests/sql_comment_boundaries.py --output protocol-results/sql-comment-local.json
          python3 tests/vector_token_types.py --output protocol-results/vector-token-types-local.json
          python3 tests/identifier_boundaries.py --output protocol-results/identifier-boundaries-local.json
          python3 tests/sqlite_differential.py --steps 2000 --output protocol-results/sqlite-differential.json
          python3 tests/exact_norm_model.py --output protocol-results/exact-norm-model.json
          python3 tests/exact_norm_boundary.py --output protocol-results/exact-norm-boundary-local.json
          python3 tests/run_extended_tsv.py
          python3 tests/formal_coverage.py
          python3 tests/state_machine_model.py --seed 20261115 --steps 1000 --output protocol-results/state-model.json
      - name: Build locked Docker runtime
        run: docker build --network=none -t minivectordb:comment-review .
      - name: DDL failure matrix is red on previous source
        run: |
          git fetch --depth=1 origin e69f120bdc19702df1614f0670fa1d02738b0051
          mvd_before_dir=$(mktemp -d)
          git archive e69f120bdc19702df1614f0670fa1d02738b0051 src | tar -x -C "$mvd_before_dir"
          mkdir -p "$mvd_before_dir/tests"
          cp tests/create_sync_failure.cpp tests/create_sync_failure.py "$mvd_before_dir/tests/"
          cp tests/build_support.py "$mvd_before_dir/tests/"
          set +e
          python3 "$mvd_before_dir/tests/create_sync_failure.py" --output "$PWD/protocol-results/ddl-before-linux.json"
          mvd_before_exit=$?
          set -e
          test "$mvd_before_exit" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('protocol-results/ddl-before-linux.json').read_text())
          assert value['passed'] is False
          rows={r['mode']:r for r in value['results']}
          assert all(rows[name]['exit_code']==1 for name in ['create','drop','index'])
          PY
      - name: DDL failure matrix preserves existing state
        run: python3 tests/create_sync_failure.py --output protocol-results/ddl-after-linux.json
      - name: Allocation regression is red on previous source
        run: |
          git fetch --depth=1 origin 8514212bbaf3966eef030c90a2ff6505a52be0b0
          mvd_before_dir=$(mktemp -d)
          git archive 8514212bbaf3966eef030c90a2ff6505a52be0b0 src | tar -x -C "$mvd_before_dir"
          mkdir -p "$mvd_before_dir/tests"
          cp tests/transaction_allocation_failure.cpp tests/transaction_allocation_failure.py "$mvd_before_dir/tests/"
          cp tests/build_support.py "$mvd_before_dir/tests/"
          set +e
          python3 "$mvd_before_dir/tests/transaction_allocation_failure.py" --output "$PWD/protocol-results/allocation-before-linux.json"
          mvd_before_exit=$?
          set -e
          test "$mvd_before_exit" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('protocol-results/allocation-before-linux.json').read_text())
          assert report['passed'] is False and report['cache']['exit_code']!=0
          PY
      - name: Allocation failure transaction and cache invariants
        run: |
          python3 tests/transaction_allocation_failure.py --output protocol-results/allocation-after-linux.json
          python3 tests/transaction_allocation_failure.py --sanitize address --output protocol-results/allocation-asan.json
          python3 tests/transaction_allocation_failure.py --sanitize undefined --output protocol-results/allocation-ubsan.json
      - name: COMMIT publication is red on previous source
        run: |
          git fetch --depth=1 origin e7be1e8d237233f4b57ebf9f082e5ee63f9d54bd
          mvd_before_dir=$(mktemp -d)
          git archive e7be1e8d237233f4b57ebf9f082e5ee63f9d54bd src | tar -x -C "$mvd_before_dir"
          mkdir -p "$mvd_before_dir/tests"
          cp tests/commit_allocation_failure.cpp tests/commit_allocation_failure.py "$mvd_before_dir/tests/"
          cp tests/build_support.py "$mvd_before_dir/tests/"
          set +e
          python3 "$mvd_before_dir/tests/commit_allocation_failure.py" --output "$PWD/protocol-results/commit-before-linux.json"
          mvd_before_exit=$?
          set -e
          test "$mvd_before_exit" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('protocol-results/commit-before-linux.json').read_text())
          assert report['passed'] is False
          assert any(row['mode'] in ['live','wide'] and row['exit_code']!=0 for row in report['results'])
          PY
      - name: COMMIT publication recovery and sanitizers
        run: |
          python3 tests/commit_allocation_failure.py --output protocol-results/commit-after-linux.json
          python3 tests/commit_allocation_failure.py --sanitize address --output protocol-results/commit-asan.json
          python3 tests/commit_allocation_failure.py --sanitize undefined --output protocol-results/commit-ubsan.json
      - name: Official public driver and comment rollback inside Docker
        run: |
          git fetch --depth=1 origin f4d4e26653af823a7601668802f80e374ad6643c
          mvd_official_dir=$(mktemp -d)
          git archive f4d4e26653af823a7601668802f80e374ad6643c protocol_check mysqltest STDIO_PROTOCOL.md | tar -x -C "$mvd_official_dir"
          python3 "$mvd_official_dir/protocol_check/run.py" --image minivectordb:comment-review --output "$PWD/protocol-results/official-public"
          python3 tests/sql_comment_boundaries.py --image minivectordb:comment-review --output protocol-results/sql-comment-docker.json
          python3 tests/vector_token_types.py --image minivectordb:comment-review --output protocol-results/vector-token-types-docker.json
          python3 tests/identifier_boundaries.py --image minivectordb:comment-review --output protocol-results/identifier-boundaries-docker.json
          python3 tests/exact_norm_boundary.py --image minivectordb:comment-review --output protocol-results/exact-norm-boundary-docker.json
      - name: Exact norm undefined-behavior and address sanitizers
        run: |
          python3 tests/exact_norm_model.py --sanitize undefined --output protocol-results/exact-norm-ubsan.json
          python3 tests/exact_norm_model.py --sanitize address --output protocol-results/exact-norm-asan.json
      - name: Upload actual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-boundary-review
          path: protocol-results
