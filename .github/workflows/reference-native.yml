name: Reference based native verification
"on":
  workflow_dispatch:
  push:
    branches: ['native/reference-opt-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source and authentic material
        run: python3 scripts/check-reference-candidate.py
      - name: Prepare mount target on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /data ]; then sudo mkdir --mode=0755 /data; fi
          test -d /data
      - name: Run native correctness checks
        run: sudo -E python3 tools/native/verify.py
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-native-evidence
          path: /tmp/mvd-ref-native-*/native-evidence/
          retention-days: 14
